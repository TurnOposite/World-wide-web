# Radio Tower — installed to /etc/NetworkManager/dnsmasq-shared.d/
# Only applies to NetworkManager "shared" connections, which on this tower
# means its own hotspot. Every name resolves to the tower, so a phone that
# joins "Radio Tower Setup" detects a captive portal and opens the setup page
# by itself. There is no internet on the hotspot to hide.
address=/#/10.42.0.1
