# Radio Tower — installed to /etc/systemd/system.conf.d/
# The Pi has a hardware watchdog. With this, systemd pets it every few
# seconds; if the whole machine freezes (kernel hang, SD card stall), the chip
# reboots it and the tower comes back on its own. 15s is the Pi's maximum.
[Manager]
RuntimeWatchdogSec=15
RebootWatchdogSec=2min
