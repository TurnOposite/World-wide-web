<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Photos — Radio Tower</title>
<meta name="description" content="Photos from the road: Kruger and travels.">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/collections.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📡</text></svg>">
</head>
<body>

<div class="scanlines" aria-hidden="true"></div>

<header class="masthead with-nav">
  <div class="mark">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" class="tower-icon">
      <path d="M12 3v18M12 3l-6 18M12 3l6 18M7.5 15h9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="12" cy="3" r="1.6" fill="currentColor"/>
    </svg>
    <div>
      <h1>Radio Tower</h1>
      <p>Photos — Kruger and the road</p>
    </div>
  </div>
</header>
<nav class="sitenav" id="sitenav" aria-label="Sections">
  <a href="/">Listen</a><a href="/schedule.html">Guide</a><a href="/library.html">Library</a><a href="/photos.html" aria-current="page">Photos</a><a href="/crates.html">Crates</a>
</nav>
<div class="ticker" id="onairTicker" hidden></div>

<main>

  <div class="room-head">
    <h2 id="roomTitle">Photos</h2>
    <p id="roomIntro">Loading…</p>
    <div class="chips" id="albumChips" role="group" aria-label="Albums"></div>
  </div>

  <div id="albums"><p class="empty-room">…</p></div>

</main>

<dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
  <div class="lb-inner">
    <button class="close-x" type="button" data-close aria-label="Close">✕</button>
    <button class="lb-nav lb-prev" type="button" data-step="-1" aria-label="Previous photo">‹</button>
    <img id="lbImg" alt="">
    <button class="lb-nav lb-next" type="button" data-step="1" aria-label="Next photo">›</button>
    <p class="lb-cap" id="lbCap"></p>
  </div>
</dialog>

<footer>
  <span id="statusLine">loading…</span>
  <span class="sep">·</span>
  <span>served from a Raspberry Pi</span>
</footer>

<script src="/sitenav.js" type="module"></script>
<script src="/photos.js" type="module"></script>
</body>
</html>
