# The self-test on every push: the same gate the Pi and every agent run use
# (BRIEF.md rule 2). Green before, red after = the change is wrong.
#
# 2026-11-24 (docs/plans/LIGHTER-2026-11-24.md, step 1): no step depends on Ubuntu's package servers any more.
# Four of the twenty runs before that took 20–30 minutes, and every time it was an install (ffmpeg from apt 12, 16
# and 26 minutes; Chromium's system packages 3–4), never a test. The browser is the runner's own Google Chrome,
# ffmpeg a pinned static build kept in the Actions cache. Each keeps its old way as a fallback, with a warning.
name: self-test

on:
  push:
    # A DJ's queue change is a commit to control.json; it changes what plays,
    # not the code, so it does not need the full test run.
    paths-ignore:
      - 'site/station/control.json'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Its name is the `test` check Vercel waits for before production (Deployment Checks): keep it.
  test:
    # Pinned, not ubuntu-latest: that label moves to Ubuntu 26 from
    # 2026-10-19, and the fallback `playwright install --with-deps` (Playwright 1.56)
    # knows the system packages of the releases it shipped with. Move this
    # with Playwright, deliberately (docs/DECISIONS.md 2026-10-13).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Read only: the code, and the list of past runs (ci-scope.mjs asks for the last green one).
    permissions:
      contents: read
      actions: read
    steps:
      # v5 of both: the first versions on Node 24 (GitHub retired Node 20 for actions).
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # A push whose files differ from the last green commit on its branch only in docs/, the root's *.md or
      # control.json runs the unit tests and none of the browser stages (scripts/ci-scope.mjs says why that is
      # safe, and why it compares with the last green run, not the previous push). About one commit in six is a
      # worklog line. Anything it cannot settle is a full run.
      - name: What changed
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-scope.mjs

      - name: Install
        run: npm ci --no-audit --no-fund

      # ffmpeg makes the test station's fixture audio. Not from apt: on 2026-11-24 apt took 26 of the job's 30 minutes
      # and the run was cancelled before any test. This is johnvansickle's static ffmpeg 7.0.2 as eugeneware/ffmpeg-static
      # republishes it (release b6.1.1) on GitHub's own release servers, checked against the sha256 GitHub lists for
      # it, and kept in the Actions cache, so most runs download nothing.
      # v5, like checkout and setup-node: the first on Node 24.
      - name: ffmpeg from the cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ffmpeg-static
          key: ffmpeg-static-b6.1.1-linux-x64

      - name: ffmpeg (fixture audio for the live stages)
        timeout-minutes: 8
        env:
          URL: https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-x64.gz
          SHA256: bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa
        run: |
          set -euo pipefail
          dir="$HOME/.cache/ffmpeg-static"
          if [ ! -x "$dir/ffmpeg" ]; then
            mkdir -p "$dir"
            if curl -fsSL --retry 3 --max-time 180 "$URL" -o "$dir/ffmpeg.gz" && echo "$SHA256  $dir/ffmpeg.gz" | sha256sum -c --status; then
              gunzip -f "$dir/ffmpeg.gz" && chmod +x "$dir/ffmpeg"
            else
              echo "::warning title=ffmpeg::the static build could not be fetched or did not match its checksum: apt instead"
              # Gone, so the cache saves nothing under this key and the next run tries the download again.
              rm -rf "$dir"
              sudo rm -f /var/lib/man-db/auto-update
              sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
              ffmpeg -hide_banner -version | sed -n 1p
              exit 0
            fi
          fi
          # The fixtures are MP3s: a build without the encoder would fail every live stage further down, less clearly.
          # Read from a file, not a pipe into grep -q: under pipefail, grep leaving early can fail a good ffmpeg.
          "$dir/ffmpeg" -hide_banner -encoders > "$RUNNER_TEMP/encoders.txt" 2>/dev/null
          grep -q libmp3lame "$RUNNER_TEMP/encoders.txt" || { echo "::error title=ffmpeg::this build cannot write MP3"; exit 1; }
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/ffmpeg" -hide_banner -version | sed -n 1p

      # The browser stages run in the Google Chrome the runner image already has (Chrome 157 on ubuntu-24.04 in
      # November 2026), as they do on the laptop: no Playwright download, no apt for its system packages. An image
      # without it gets Playwright's own Chromium, as before.
      - name: A browser for the browser stages
        if: steps.scope.outputs.full != 'no'
        run: |
          if exe="$(command -v google-chrome || command -v google-chrome-stable)"; then
            echo "TOWER_BROWSER_EXECUTABLE=$exe" >> "$GITHUB_ENV"
            "$exe" --version
          else
            echo "::warning title=browser::no Google Chrome on this runner image: Playwright's Chromium instead"
            npx playwright install --with-deps chromium
          fi

      - name: Site inputs are up to date
        run: |
          node scripts/site-sync.mjs --check
          node scripts/site-texts.mjs --check
          node scripts/site-echo.mjs --check
          node scripts/site-collections.mjs --check
          node scripts/cloud-library.mjs check

      - name: Self-test
        if: steps.scope.outputs.full != 'no'
        run: |
          set -o pipefail
          bash scripts/build-test.sh 2>&1 | tee selftest.log

      - name: Unit tests (a docs-only push)
        if: steps.scope.outputs.full == 'no'
        run: |
          set -o pipefail
          npm test 2>&1 | tee selftest.log

      # What failed, where anyone can read it without signing in: as annotations on the run (the public API lists
      # them) and on the run's summary page. The log itself needs a GitHub login (BACKLOG B5, 2026-11-17).
      # Only lines that start with a failure mark: a passing check whose detail quotes a ✗ is not one (2026-11-24).
      - name: What failed
        if: failure()
        run: |
          tr -d "\033" < selftest.log | sed "s/\[[0-9;]*m//g" | grep -E "^ *(FAIL|not ok|✖|✗)" | head -20 > failed.txt || true
          while IFS= read -r line; do echo "::error title=self-test::$(printf '%s' "$line" | cut -c1-900)"; done < failed.txt
          { echo '### What failed'; echo; echo '```'; cat failed.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
