# The self-test on every push: the same gate the Pi and every agent run use
# (BRIEF.md rule 2). Green before, red after = the change is wrong.
#
# 2026-11-24 (docs/plans/LIGHTER-2026-11-24.md):
#   step 1 — no step depends on Ubuntu's package servers (.github/actions/tower-setup says how);
#   step 2 — the site smoke, three quarters of the run, is in parts that read nothing from each other
#            (scripts/smoke/), so the biggest run side by side in jobs of their own while the self-test runs the rest.
#            The run takes as long as its longest job, not the sum. The job called `test` is the verdict.
name: self-test

on:
  push:
    # A DJ's queue change is a commit to control.json; it changes what plays,
    # not the code, so it does not need the full test run.
    paths-ignore:
      - 'site/station/control.json'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read only, everywhere: the code, and the list of past runs (ci-scope.mjs asks for the last green one).
permissions:
  contents: read
  actions: read

jobs:
  # A push whose files differ from the last green commit on its branch only in docs/, the root's *.md or control.json
  # runs the unit tests and none of the browser stages (scripts/ci-scope.mjs says why that is safe, and why it compares
  # with the last green run, not the previous push). About one commit in six is a worklog line. Anything it cannot
  # settle is a full run.
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v5
      - name: What changed
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-scope.mjs

  # Everything but the three biggest parts of the site smoke: the unit tests, the live server, the HTTP surface, the
  # player, the site's dist/ and tower-mode parts (they need the server this starts), the Atelier.
  self-test:
    needs: scope
    # Pinned, not ubuntu-latest: that label moves to Ubuntu 26 from
    # 2026-10-19, and the fallback `playwright install --with-deps` (Playwright 1.56)
    # knows the system packages of the releases it shipped with. Move this
    # with Playwright, deliberately (docs/DECISIONS.md 2026-10-13).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/tower-setup
        with:
          browser: ${{ needs.scope.outputs.full != 'no' }}

      - name: Site inputs are up to date
        run: |
          node scripts/site-sync.mjs --check
          node scripts/site-texts.mjs --check
          node scripts/site-echo.mjs --check
          node scripts/site-collections.mjs --check
          node scripts/cloud-library.mjs check

      - name: Self-test
        if: needs.scope.outputs.full != 'no'
        env:
          # The other parts are the site job's (below).
          SITE_SMOKE_ONLY: dist,tower
        run: |
          set -o pipefail
          bash scripts/build-test.sh 2>&1 | tee selftest.log

      - name: Unit tests (a docs-only push)
        if: needs.scope.outputs.full == 'no'
        run: |
          set -o pipefail
          npm test 2>&1 | tee selftest.log

      - name: What failed
        if: failure()
        uses: ./.github/actions/what-failed

  # The site smoke's parts that need no live server, each in a job of its own (scripts/site-smoke.mjs --only).
  site:
    needs: scope
    if: needs.scope.outputs.full != 'no'
    name: site (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Every part reports, even when one is red: the annotations then say all that failed, not the first.
      fail-fast: false
      matrix:
        part: [pages, world, phone]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/tower-setup
      - name: Site smoke
        run: |
          set -o pipefail
          node scripts/site-smoke.mjs --only ${{ matrix.part }} 2>&1 | tee selftest.log
      - name: What failed
        if: failure()
        uses: ./.github/actions/what-failed
        with:
          title: site (${{ matrix.part }})

  # Its name is the `test` check Vercel waits for before production (Deployment Checks): keep it. Green only when every
  # job above is; the site's parts may be skipped only on a short run (scripts/ci-scope.mjs, gate()).
  test:
    needs: [scope, self-test, site]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Every job green
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-scope.mjs --gate
